name: Build & Deploy Storefront (ECR → EC2)

# Build the image, push to ECR, then deploy to the AWS server on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ecom
  cancel-in-progress: true

# Secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  IAM user of the Sydney ECR account (211107604014) with push access to hopscotch-ecom
#   EC2_HOST, EC2_USER, EC2_DEPLOY_DIR        the shared AWS server and /var/www/hopscotch on it
#   EC2_SSH_KEY                               private key whose public half (comment: github-actions-hopscotch-deploy) is in ubuntu's authorized_keys
# This repo used to push to the Mumbai ECR (ap-south-1, account 546941058055); that registry is no longer used.
env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: hopscotch-ecom
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}
  DEPLOY_DIR: ${{ secrets.EC2_DEPLOY_DIR }}   # /var/www/hopscotch; must match DEPLOY_DIR in the server's config.sh

jobs:
  build-and-deploy:
    name: Build image, push to ECR, deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # NEXT_PUBLIC_API_URL is inlined into the client bundle at build time,
          # so it must be a build arg — setting it at container start would be too
          # late. Includes /api: the axios client uses it as baseURL with endpoints
          # that carry no prefix of their own.
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build \
            --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_URL=https://api.fciseller.com/api \
            -t "$IMAGE_URI:$IMAGE_TAG" \
            -t "$IMAGE_URI:latest" \
            .
          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"
          echo "image=$IMAGE_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Add SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      # Pin the new registry + image tag in the server's config.sh, then run
      # ecom.sh (pull -> restart the storefront container only -> install its
      # nginx site). The job fails if the storefront does not answer on its
      # local port afterwards.
      - name: Pin image and deploy
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${EC2_USER}@${EC2_HOST}" \
            bash -s -- "${DEPLOY_DIR}" "${ECR_REGISTRY}" "${IMAGE_TAG}" <<'REMOTE'
          set -euo pipefail
          DEPLOY_DIR="$1"; REGISTRY="$2"; TAG="$3"
          cd "$DEPLOY_DIR"
          chmod +x ./*.sh
          sed -i "s|^export ECR_REGISTRY=.*|export ECR_REGISTRY=\"${REGISTRY}\"|" config.sh
          sed -i "s|^export ECOM_IMAGE_TAG=.*|export ECOM_IMAGE_TAG=\"${TAG}\"|" config.sh
          ./ecom.sh
          PORT="$(sed -n 's/^export ECOM_HOST_PORT="\([0-9]*\)".*/\1/p' config.sh)"
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null "http://127.0.0.1:${PORT}/"; then echo "hopscotch-ecom answers on :${PORT}"; exit 0; fi
            sleep 3
          done
          echo "hopscotch-ecom did not answer on :${PORT}" >&2
          docker logs --tail 60 hopscotch-ecom || true
          exit 1
          REMOTE

      - name: Deploy summary
        if: always()
        run: |
          echo "### Storefront deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${{ steps.build-image.outputs.image }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA::12}\`" >> "$GITHUB_STEP_SUMMARY"
